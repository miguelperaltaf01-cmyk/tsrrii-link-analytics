<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatorio de Métricas — Vacantes/Becas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
   * {
  box-sizing: border-box;
}

:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --text: #172033;
  --muted: #697386;
  --muted-light: #8a93a3;
  --border: #e5e9f0;
  --primary: #172033;
  --primary-soft: #eef2ff;
  --shadow: 0 8px 28px rgba(23, 32, 51, 0.07);
  --shadow-hover: 0 12px 32px rgba(23, 32, 51, 0.11);
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,0.95), transparent 35%),
    linear-gradient(135deg, #f3f6fa 0%, #e9eef5 100%);
  color: var(--text);
  min-height: 100vh;
}

.container {
  max-width: 1280px;
  margin: auto;
  padding: 34px 24px 50px;
}

/* =========================
   HEADER
========================= */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 30px;
  margin-bottom: 30px;
  padding: 24px 26px;
  background: rgba(255,255,255,0.88);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 20px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 17px;
}

.logo {
  width: 68px;
  height: 68px;
  object-fit: contain;
  border-radius: 16px;
  flex-shrink: 0;
  background: white;
  box-shadow: 0 5px 16px rgba(23, 32, 51, 0.10);
}

header h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: -0.6px;
}

header p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.updated {
  margin-top: 9px;
  font-size: 12px;
  color: var(--muted-light);
}

/* =========================
   CONTROLES
========================= */

header > div:last-child {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.refresh {
  border: none;
  background: var(--primary);
  color: white;
  padding: 11px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s ease;
}

.refresh:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(23, 32, 51, 0.16);
}

#period {
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
}

#period:focus {
  outline: none;
  border-color: #aeb8c9;
}

/* =========================
   LOADING / ERROR
========================= */

.loading {
  text-align: center;
  padding: 55px;
  color: var(--muted);
}

.error {
  background: #fff0f0;
  color: #b42318;
  padding: 18px;
  border-radius: 12px;
  border: 1px solid #ffd6d6;
}

/* =========================
   MÉTRICAS PRINCIPALES
========================= */

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 22px;
}

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid rgba(229,233,240,0.9);
  border-radius: 17px;
  padding: 22px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: 0.2s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

.card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 4px;
  height: 100%;
  background: var(--primary);
}

.card .label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 11px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.card .number {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.7px;
  line-height: 1.15;
}

/* =========================
   PANELES
========================= */

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.panel {
  background: var(--surface);
  border: 1px solid rgba(229,233,240,0.9);
  border-radius: 17px;
  padding: 24px;
  box-shadow: var(--shadow);
}

.panel h2 {
  margin-top: 0;
  margin-bottom: 18px;
  font-size: 18px;
  letter-spacing: -0.2px;
}

/* =========================
   LISTAS
========================= */

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #edf0f5;
  font-size: 14px;
}

.item:last-child {
  border-bottom: none;
}

.count {
  font-weight: bold;
}

/* =========================
   PAÍSES
========================= */

.country-chart {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 10px;
}

.country-row {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.country-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.country-name {
  font-weight: bold;
}

.country-value {
  color: var(--muted);
  font-weight: bold;
}

.country-bar-background {
  width: 100%;
  height: 9px;
  background: #edf0f5;
  border-radius: 999px;
  overflow: hidden;
}

.country-bar {
  height: 100%;
  background: var(--primary);
  border-radius: 999px;
  transition: width 0.3s ease;
}

/* =========================
   GRÁFICOS
========================= */

.chart {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 220px;
  padding-top: 20px;
}

.bar-container {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.bar {
  width: 100%;
  max-width: 45px;
  background: var(--primary);
  border-radius: 7px 7px 0 0;
  min-height: 4px;
  transition: height 0.3s ease;
}

.bar-value {
  font-size: 12px;
  font-weight: bold;
}

.bar-label {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================
   TABLA DE ENLACES
========================= */

.links {
  width: 100%;
  border-collapse: collapse;
}

.links th,
.links td {
  text-align: left;
  padding: 14px 10px;
  border-bottom: 1px solid #edf0f5;
}

.links th {
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.links tbody tr {
  transition: 0.15s ease;
}

.links tbody tr:hover {
  background: #fafbfc;
}

/* =========================
   BADGES
========================= */

.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--text);
  font-size: 12px;
  font-weight: bold;
}

/* =========================
   BOTONES DE FUENTES
========================= */

.copy-button {
  border: none;
  background: var(--primary);
  color: white;
  padding: 7px 11px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  transition: 0.18s ease;
}

.copy-button:hover {
  opacity: 0.88;
  transform: translateY(-1px);
}

.copy-button:disabled {
  opacity: 0.65;
  cursor: default;
  transform: none;
}

/* =========================
   SELECTORES
========================= */

.source-select {
  border: 1px solid #d9dee8;
  background: white;
  color: var(--text);
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 12px;
  margin-right: 6px;
  cursor: pointer;
}

.source-select:focus {
  outline: none;
  border-color: var(--primary);
}
/* =========================
   MODAL CREAR ENLACE
========================= */

.modal-overlay {
  display: none !important;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active {
  display: flex !important;
}

.modal {
  width: 100%;
  max-width: 520px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 25px 70px rgba(15, 23, 42, 0.25);
  overflow: hidden;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  padding: 22px 24px;
  border-bottom: 1px solid var(--border);
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.modal-header p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.modal-close {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
}

.modal-close:hover {
  color: var(--text);
}

.modal-body {
  padding: 24px;
}

.modal-body label {
  display: block;
  margin-bottom: 7px;
  margin-top: 16px;
  font-size: 13px;
  font-weight: bold;
  color: var(--text);
}

.modal-body label:first-child {
  margin-top: 0;
}

.modal-body input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #d9dee8;
  border-radius: 9px;
  font-size: 14px;
  color: var(--text);
  outline: none;
}

.modal-body input:focus {
  border-color: #9aa6ba;
  box-shadow: 0 0 0 3px rgba(23, 32, 51, 0.06);
}

.slug-preview {
  padding: 11px 12px;
  background: #f5f7fa;
  border: 1px solid #e5e9f0;
  border-radius: 9px;
  font-size: 13px;
  color: var(--text);
  min-height: 40px;
}

.slug-help {
  display: block;
  margin-top: 7px;
  color: var(--muted-light);
  font-size: 12px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  padding: 18px 24px;
  border-top: 1px solid var(--border);
  background: #fafbfc;
}

.modal-cancel,
.modal-create {
  border: none;
  padding: 10px 15px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
}

.modal-cancel {
  background: #eef1f5;
  color: var(--text);
}

.modal-create {
  background: var(--primary);
  color: white;
}

.modal-cancel:hover,
.modal-create:hover {
  transform: translateY(-1px);
}
/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

  .cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .grid {
    grid-template-columns: 1fr;
  }

  header {
    align-items: flex-start;
  }

}

@media (max-width: 700px) {

  .container {
    padding: 20px 14px 35px;
  }

  header {
    flex-direction: column;
    padding: 20px;
  }

  header > div:last-child {
    width: 100%;
    justify-content: flex-start;
  }

  header h1 {
    font-size: 25px;
  }

  .logo {
    width: 58px;
    height: 58px;
  }

}

@media (max-width: 500px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .brand {
    align-items: flex-start;
  }

  .panel {
    padding: 18px;
    overflow-x: auto;
  }

  .links {
    min-width: 720px;
    font-size: 13px;
  }

  .card .number {
    font-size: 28px;
  }

  .chart {
    min-width: 500px;
  }

}
  </style>
</head>

<body>

  <div class="container">

  <header>

  <div class="brand">

    <img
      src="/logo-tsrrii.jpg"
      alt="Todo Sobre RRII"
      class="logo"
    >

    <div>
      <h1>Observatorio de Métricas</h1>

      <p>
        Vacantes/Becas · Panel de seguimiento y análisis
      </p>

      <div class="updated" id="updated">
        Cargando...
      </div>
    </div>

  </div>

  <div>
    <button class="refresh" onclick="openCreateLink()">
      + Crear enlace
    </button>

    <select id="period" onchange="loadStats()">
      <option value="today">Hoy</option>
      <option value="7">Últimos 7 días</option>
      <option value="30">Últimos 30 días</option>
      <option value="all">Todo</option>
    </select>

    <button class="refresh" onclick="loadStats()">
      ↻ Actualizar
    </button>
  </div>

</header>
<!-- MODAL CREAR ENLACE -->

<div id="createLinkModal" class="modal-overlay">

  <div class="modal">

    <div class="modal-header">
      <div>
        <h2>Crear nuevo enlace</h2>
        <p>Generá un enlace para un nuevo reporte u oportunidad.</p>
      </div>

      <button
        type="button"
        class="modal-close"
        onclick="closeCreateLink()"
      >
        ×
      </button>
    </div>

    <div class="modal-body">

      <label for="linkName">
        Nombre del enlace
      </label>

      <input
        type="text"
        id="linkName"
        placeholder="Ej. Reporte laboral 25.08.2026"
        autocomplete="off"
      >
      <label for="linkUrl">
        URL de destino
      </label>

      <input
        type="url"
        id="linkUrl"
        placeholder="https://..."
        autocomplete="off"
      >

      <label>
        Slug generado
      </label>

      <div class="slug-preview">
        <span id="slugPreview">
          —
        </span>
      </div>

      <small class="slug-help">
        Se genera automáticamente a partir del nombre.
      </small>

    </div>

    <div class="modal-footer">

      <button
        type="button"
        class="modal-cancel"
        onclick="closeCreateLink()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="modal-create"
        onclick="submitCreateLink()"
      >
        Crear enlace
      </button>

    </div>

  </div>

</div>
<div id="content">

  <div class="loading">
    Cargando estadísticas...
  </div>
  </div>
  <script>

    async function loadStats() {

      const content = document.getElementById("content");
      const updated = document.getElementById("updated");

      content.innerHTML = `
        <div class="loading">
          Cargando estadísticas...
        </div>
      `;

      try {

        const period = document.getElementById("period").value;

const response = await fetch(`/api/stats?period=${period}`);

        if (!response.ok) {
          throw new Error("No se pudieron obtener las estadísticas");
        }

        const stats = await response.json();
console.log("STATS DEL DASHBOARD:", stats);
        const sources = Object.entries(stats.by_source || {});
        const countries = Object.entries(stats.by_country || {});
        const devices = Object.entries(stats.by_device || {});
        const days = Object.entries(stats.by_day || {});
        const links = stats.by_link || [];
const maxLinkClicks = Math.max(
  ...links.map(link => link.clicks),
  1
);

const sortedLinks = [...links].sort(
  (a, b) => b.clicks - a.clicks
);

const linkChart = sortedLinks.map(link => {

  const height = Math.max(
    (link.clicks / maxLinkClicks) * 100,
    4
  );

  const percentage = stats.total_clicks
    ? ((link.clicks / stats.total_clicks) * 100).toFixed(1)
    : "0.0";

  return `
    <div class="bar-container">

     <div class="bar-value">
  ${link.clicks}
  <small style="color:#697386; font-weight:normal;">
    (${percentage}%)
  </small>
</div>

      <div
        class="bar"
        style="height:${height}%"
        title="${link.name}: ${link.clicks} clics"
      ></div>

      <div class="bar-label">
        ${link.name || link.slug || "-"}
      </div>

    </div>
  `;

}).join("");

        const maxDay = Math.max(
          ...days.map(([_, value]) => value),
          1
        );

        const chart = days.map(([day, value]) => {

          const height = Math.max(
            (value / maxDay) * 100,
            4
          );

          return `
            <div class="bar-container">

              <div class="bar-value">
                ${value}
              </div>

              <div
                class="bar"
                style="height:${height}%"
                title="${day}: ${value} clics"
              ></div>

              <div class="bar-label">
                ${formatDay(day)}
              </div>

            </div>
          `;

        }).join("");

        content.innerHTML = `

          <div class="cards">

  <div class="card">
    <div class="label">
      Clics totales
    </div>

    <div class="number">
      ${stats.total_clicks || 0}
    </div>
  </div>

  <div class="card">
    <div class="label">
      Fuente principal
    </div>

    <div class="number" style="font-size:24px;">
      ${
        sources.length
          ? [...sources].sort((a, b) => b[1] - a[1])[0][0]
          : "-"
      }
    </div>
  </div>

  <div class="card">
    <div class="label">
      País principal
    </div>

    <div class="number" style="font-size:24px;">
      ${
  countries.length
    ? getCountryName(
        [...countries].sort((a, b) => b[1] - a[1])[0][0]
      )
    : "-"
}
    </div>
  </div>

  <div class="card">
    <div class="label">
      Enlace más visitado
    </div>

    <div class="number" style="font-size:20px;">
      ${
        sortedLinks.length
          ? sortedLinks[0].name || sortedLinks[0].slug
          : "-"
      }
    </div>
  </div>

</div>

          <div class="grid">

            <div class="panel">

              <h2>
                Fuentes
              </h2>

              ${renderSourceList(sources, stats.total_clicks)}

            </div>


            <div class="panel">

              <h2>
                Países
              </h2>

              ${renderCountryChart(countries, stats.total_clicks)}

            </div>


            <div class="panel">

              <h2>
                Dispositivos
              </h2>

              ${renderList(devices)}

            </div>


            <div class="panel">

              <h2>
                Clics por día
              </h2>

              <div class="chart">

                ${chart || "<p>No hay datos.</p>"}

              </div>

            </div>
<div class="panel">

  <h2>
    Clics por enlace
  </h2>

  <div class="chart">

    ${linkChart || "<p>No hay datos.</p>"}

  </div>

</div>
<div class="panel">

  <h2>
    Fuentes por enlace
  </h2>

  ${renderSourcesByLink(sortedLinks)}

</div>
          </div>


          <div class="panel">

            <h2>
              Enlaces
            </h2>

            <table class="links">

              <thead>

                <tr>
                 <th>Enlace</th>
<th>Slug</th>
<th>Clics</th>
<th>Acción</th>
                </tr>

              </thead>

              <tbody>

                ${
                  sortedLinks.length
  ? sortedLinks.map(link => `

                      <tr>

                        <td>
                          ${link.name || "Enlace desconocido"}
                        </td>

                        <td>
                          <span class="badge">
                            ${link.slug || "-"}
                          </span>
                        </td>

                        <td>
                          <strong>
                            ${link.clicks}
                          </strong>
                        </td>
<td>

  <div style="display:flex; flex-wrap:wrap; gap:6px;">

    <button
      onclick="copySourceLink('${link.slug}', 'whatsapp', this)"
      class="copy-button"
    >
      WhatsApp
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'instagram', this)"
      class="copy-button"
    >
      Instagram
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'facebook', this)"
      class="copy-button"
    >
      Facebook
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'tiktok', this)"
      class="copy-button"
    >
      TikTok
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'x', this)"
      class="copy-button"
    >
      X
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'substack', this)"
      class="copy-button"
    >
      Substack
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'linkedin', this)"
      class="copy-button"
    >
      LinkedIn
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'web', this)"
      class="copy-button"
    >
      Web
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'direct', this)"
      class="copy-button"
    >
      Directo
    </button>

  </div>

</td>
                      </tr>

                    `).join("")
                    : `
                      <tr>
                        <td colspan="4">
                          No hay enlaces registrados.
                        </td>
                      </tr>
                    `
                }

              </tbody>

            </table>

          </div>

        `;

        updated.textContent =
          "Última actualización: " +
          new Date().toLocaleString("es-PY");

      } catch (error) {

        content.innerHTML = `
          <div class="error">
            Error cargando estadísticas:
            ${error.message}
          </div>
        `;

        updated.textContent = "";

      }

    }

    function renderList(items) {

      if (!items.length) {
        return "<p>No hay datos.</p>";
      }

      return items
        .map(([name, value]) => `

          <div class="item">

            <span>
              ${name}
            </span>

            <span class="count">
              ${value}
            </span>

          </div>

        `)
        .join("");

    function renderCountryChart(items, total) {

  if (!items.length) {
    return "<p>No hay datos.</p>";
  }

  const sorted = [...items].sort((a, b) => b[1] - a[1]);

  const maxValue = Math.max(
    ...sorted.map(([_, value]) => value),
    1
  );

  return `
    <div class="country-chart">

      ${sorted.map(([name, value]) => {

        const width = (value / maxValue) * 100;

        const percentage = total
          ? ((value / total) * 100).toFixed(1)
          : "0.0";

        return `
          <div class="country-row">

            <div class="country-header">

              <span class="country-name">
  ${getCountryName(name)}
</span>

              <span class="country-value">
                ${value} (${percentage}%)
              </span>

            </div>

            <div class="country-bar-background">

              <div
                class="country-bar"
                style="width:${width}%"
              ></div>

            </div>

          </div>
        `;

      }).join("")}

    </div>
  `;
}
    function renderSourceList(items, total) {

  if (!items.length) {
    return "<p>No hay datos.</p>";
  }

  return items
    .sort((a, b) => b[1] - a[1])
    .map(([name, value]) => {

      const percentage = total
        ? ((value / total) * 100).toFixed(1)
        : "0.0";

      return `

        <div class="item">

         <span>
  ${getSourceName(name)}
</span>

          <span class="count">
            ${value}

            <small style="color:#697386; font-weight:normal;">
              (${percentage}%)
            </small>

          </span>

        </div>

      `;

    })
    .join("");

}
function renderSourcesByLink(links) {

  if (!links.length) {
    return "<p>No hay datos.</p>";
  }

  return links.map(link => {

    const sources = Object.entries(link.sources || {})
      .sort((a, b) => b[1] - a[1]);

    const sourceItems = sources.length
      ? sources.map(([source, value]) => {

          const percentage = link.clicks
            ? ((value / link.clicks) * 100).toFixed(1)
            : "0.0";

          return `
            <div style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              padding:8px 0;
              border-bottom:1px solid #f1f3f7;
            ">

              <span>
                ${getSourceName(source)}
              </span>

              <span>
                <strong>${value}</strong>

                <small style="
                  color:#697386;
                  font-weight:normal;
                  margin-left:5px;
                ">
                  (${percentage}%)
                </small>

              </span>

            </div>
          `;

        }).join("")
      : "<span style='color:#697386;'>Sin fuentes registradas</span>";

    return `
      <div style="
        padding:14px 0;
        border-bottom:1px solid #edf0f5;
      ">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:15px;
          margin-bottom:10px;
        ">

          <strong>
            ${link.name || link.slug || "Enlace desconocido"}
          </strong>

          <span class="badge">
            ${link.clicks} clics
          </span>

        </div>

        <div>
          ${sourceItems}
        </div>

      </div>
    `;

  }).join("");

}
async function copySourceLink(slug, source, button) {

  const url =
    `${window.location.origin}/${slug}?source=${encodeURIComponent(source)}`;

  try {

    await navigator.clipboard.writeText(url);

    const originalText = button.textContent;

    button.textContent = "✓ Copiado";
    button.disabled = true;

    setTimeout(() => {

      button.textContent = originalText;
      button.disabled = false;

    }, 1500);

  } catch (error) {

    console.error("No se pudo copiar el enlace:", error);

    alert("No se pudo copiar el enlace.");

  }

}

const modal = document.getElementById("createLinkModal");

 function closeCreateLink() {

  }
}

function generateSlug(name) {
  return name
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}
document.getElementById("linkName").addEventListener("input", function () {

  const slug = generateSlug(this.value);

  document.getElementById("slugPreview").textContent =
    slug || "—";

});
function submitCreateLink() {

  const name = document.getElementById("linkName").value.trim();
  const destination_url = document.getElementById("linkUrl").value.trim();

  if (!name) {
    alert("Ingresá un nombre para el enlace.");
    return;
  }

  if (!destination_url) {
    alert("Ingresá la URL de destino.");
    return;
  }

  const slug = generateSlug(name);

  if (!slug) {
    alert("No se pudo generar un slug válido.");
    return;
  }

  createLink(name, slug, destination_url);
}
async function createLink(name, slug, destination_url) {

  try {

    const response = await fetch("/api/create-link", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        slug,
        destination_url
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        "No se pudo crear el enlace"
      );
    }

    alert("✓ Enlace creado correctamente");

    loadStats();

  } catch (error) {

    console.error("Error creando enlace:", error);

    alert(
      "No se pudo crear el enlace:\n" +
      error.message
    );

  }

}
