<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatorio de Métricas — Vacantes/Becas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  width: 64px;
  height: 64px;
  object-fit: contain;
  border-radius: 12px;
  flex-shrink: 0;
}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 32px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
      color: #697386;
    }

    .refresh {
      border: none;
      background: #172033;
      color: white;
      padding: 11px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .refresh:hover {
      opacity: 0.9;
    }

    .updated {
      margin-top: 8px;
      font-size: 12px;
      color: #8a93a3;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .card .label {
      color: #697386;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card .number {
      font-size: 32px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .panel h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .item:last-child {
      border-bottom: none;
    }

    .count {
      font-weight: bold;
    }
.country-chart {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 10px;
}

.country-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.country-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.country-name {
  font-weight: bold;
}

.country-value {
  color: #697386;
  font-weight: bold;
}

.country-bar-background {
  width: 100%;
  height: 10px;
  background: #edf0f5;
  border-radius: 999px;
  overflow: hidden;
}

.country-bar {
  height: 100%;
  background: #172033;
  border-radius: 999px;
  transition: width 0.3s ease;
}
    .links {
      width: 100%;
      border-collapse: collapse;
    }

    .links th,
    .links td {
      text-align: left;
      padding: 14px 10px;
      border-bottom: 1px solid #edf0f5;
    }

    .links th {
      color: #697386;
      font-size: 13px;
    }

   .badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 999px;
  background: #eef2ff;
  font-size: 12px;
  font-weight: bold;
}

.copy-button {
  border: none;
  background: #172033;
  color: white;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
}
.source-select {
  border: 1px solid #d9dee8;
  background: white;
  color: #172033;
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 12px;
  margin-right: 6px;
  cursor: pointer;
}

.source-select:focus {
  outline: none;
  border-color: #172033;
}
.copy-button:hover {
  opacity: 0.85;
}

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 220px;
      padding-top: 20px;
    }

    .bar-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .bar {
      width: 100%;
      max-width: 45px;
      background: #172033;
      border-radius: 7px 7px 0 0;
      min-height: 4px;
      transition: height 0.3s ease;
    }

    .bar-value {
      font-size: 12px;
      font-weight: bold;
    }

    .bar-label {
      font-size: 11px;
      color: #697386;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #697386;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 18px;
      border-radius: 10px;
    }

    @media (max-width: 800px) {

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
      }
    }

    @media (max-width: 500px) {

      .cards {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 20px 14px;
      }

      .card .number {
        font-size: 28px;
      }

      .links {
        font-size: 13px;
      }

      .links th,
      .links td {
        padding: 10px 6px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

  <header>

  <div class="brand">

    <img
      src="/logo-tsrrii.png"
      alt="Todo Sobre RRII"
      class="logo"
    >

    <div>
      <h1>Observatorio de Métricas</h1>

      <p>
        Vacantes/Becas · Panel de seguimiento y análisis
      </p>

      <div class="updated" id="updated">
        Cargando...
      </div>
    </div>

  </div>

  <div>
    <button class="refresh" onclick="openCreateLink()">
      + Crear enlace
    </button>

    <select id="period" onchange="loadStats()">
      <option value="today">Hoy</option>
      <option value="7">Últimos 7 días</option>
      <option value="30">Últimos 30 días</option>
      <option value="all">Todo</option>
    </select>

    <button class="refresh" onclick="loadStats()">
      ↻ Actualizar
    </button>
  </div>

</header>

<div id="content">

  <div class="loading">
    Cargando estadísticas...
  </div>
  </div>
  <script>

    async function loadStats() {

      const content = document.getElementById("content");
      const updated = document.getElementById("updated");

      content.innerHTML = `
        <div class="loading">
          Cargando estadísticas...
        </div>
      `;

      try {

        const period = document.getElementById("period").value;

const response = await fetch(`/api/stats?period=${period}`);

        if (!response.ok) {
          throw new Error("No se pudieron obtener las estadísticas");
        }

        const stats = await response.json();

        const sources = Object.entries(stats.by_source || {});
        const countries = Object.entries(stats.by_country || {});
        const devices = Object.entries(stats.by_device || {});
        const days = Object.entries(stats.by_day || {});
        const links = stats.by_link || [];
const maxLinkClicks = Math.max(
  ...links.map(link => link.clicks),
  1
);

const sortedLinks = [...links].sort(
  (a, b) => b.clicks - a.clicks
);

const linkChart = sortedLinks.map(link => {

  const height = Math.max(
    (link.clicks / maxLinkClicks) * 100,
    4
  );

  const percentage = stats.total_clicks
    ? ((link.clicks / stats.total_clicks) * 100).toFixed(1)
    : "0.0";

  return `
    <div class="bar-container">

     <div class="bar-value">
  ${link.clicks}
  <small style="color:#697386; font-weight:normal;">
    (${percentage}%)
  </small>
</div>

      <div
        class="bar"
        style="height:${height}%"
        title="${link.name}: ${link.clicks} clics"
      ></div>

      <div class="bar-label">
        ${link.name || link.slug || "-"}
      </div>

    </div>
  `;

}).join("");

        const maxDay = Math.max(
          ...days.map(([_, value]) => value),
          1
        );

        const chart = days.map(([day, value]) => {

          const height = Math.max(
            (value / maxDay) * 100,
            4
          );

          return `
            <div class="bar-container">

              <div class="bar-value">
                ${value}
              </div>

              <div
                class="bar"
                style="height:${height}%"
                title="${day}: ${value} clics"
              ></div>

              <div class="bar-label">
                ${formatDay(day)}
              </div>

            </div>
          `;

        }).join("");

        content.innerHTML = `

          <div class="cards">

  <div class="card">
    <div class="label">
      Clics totales
    </div>

    <div class="number">
      ${stats.total_clicks || 0}
    </div>
  </div>

  <div class="card">
    <div class="label">
      Fuente principal
    </div>

    <div class="number" style="font-size:24px;">
      ${
        sources.length
          ? [...sources].sort((a, b) => b[1] - a[1])[0][0]
          : "-"
      }
    </div>
  </div>

  <div class="card">
    <div class="label">
      País principal
    </div>

    <div class="number" style="font-size:24px;">
      ${
  countries.length
    ? getCountryName(
        [...countries].sort((a, b) => b[1] - a[1])[0][0]
      )
    : "-"
}
    </div>
  </div>

  <div class="card">
    <div class="label">
      Enlace más visitado
    </div>

    <div class="number" style="font-size:20px;">
      ${
        sortedLinks.length
          ? sortedLinks[0].name || sortedLinks[0].slug
          : "-"
      }
    </div>
  </div>

</div>

          <div class="grid">

            <div class="panel">

              <h2>
                Fuentes
              </h2>

              ${renderSourceList(sources, stats.total_clicks)}

            </div>


            <div class="panel">

              <h2>
                Países
              </h2>

              ${renderCountryChart(countries, stats.total_clicks)}

            </div>


            <div class="panel">

              <h2>
                Dispositivos
              </h2>

              ${renderList(devices)}

            </div>


            <div class="panel">

              <h2>
                Clics por día
              </h2>

              <div class="chart">

                ${chart || "<p>No hay datos.</p>"}

              </div>

            </div>
<div class="panel">

  <h2>
    Clics por enlace
  </h2>

  <div class="chart">

    ${linkChart || "<p>No hay datos.</p>"}

  </div>

</div>
<div class="panel">

  <h2>
    Fuentes por enlace
  </h2>

  ${renderSourcesByLink(sortedLinks)}

</div>
          </div>


          <div class="panel">

            <h2>
              Enlaces
            </h2>

            <table class="links">

              <thead>

                <tr>
                 <th>Enlace</th>
<th>Slug</th>
<th>Clics</th>
<th>Acción</th>
                </tr>

              </thead>

              <tbody>

                ${
                  sortedLinks.length
  ? sortedLinks.map(link => `

                      <tr>

                        <td>
                          ${link.name || "Enlace desconocido"}
                        </td>

                        <td>
                          <span class="badge">
                            ${link.slug || "-"}
                          </span>
                        </td>

                        <td>
                          <strong>
                            ${link.clicks}
                          </strong>
                        </td>
<td>

  <div style="display:flex; flex-wrap:wrap; gap:6px;">

    <button
      onclick="copySourceLink('${link.slug}', 'whatsapp', this)"
      class="copy-button"
    >
      WhatsApp
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'instagram', this)"
      class="copy-button"
    >
      Instagram
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'facebook', this)"
      class="copy-button"
    >
      Facebook
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'tiktok', this)"
      class="copy-button"
    >
      TikTok
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'x', this)"
      class="copy-button"
    >
      X
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'substack', this)"
      class="copy-button"
    >
      Substack
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'linkedin', this)"
      class="copy-button"
    >
      LinkedIn
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'web', this)"
      class="copy-button"
    >
      Web
    </button>

    <button
      onclick="copySourceLink('${link.slug}', 'direct', this)"
      class="copy-button"
    >
      Directo
    </button>

  </div>

</td>
                      </tr>

                    `).join("")
                    : `
                      <tr>
                        <td colspan="4">
                          No hay enlaces registrados.
                        </td>
                      </tr>
                    `
                }

              </tbody>

            </table>

          </div>

        `;

        updated.textContent =
          "Última actualización: " +
          new Date().toLocaleString("es-PY");

      } catch (error) {

        content.innerHTML = `
          <div class="error">
            Error cargando estadísticas:
            ${error.message}
          </div>
        `;

        updated.textContent = "";

      }

    }

    function renderList(items) {

      if (!items.length) {
        return "<p>No hay datos.</p>";
      }

      return items
        .map(([name, value]) => `

          <div class="item">

            <span>
              ${name}
            </span>

            <span class="count">
              ${value}
            </span>

          </div>

        `)
        .join("");

    }

    function renderCountryChart(items, total) {

  if (!items.length) {
    return "<p>No hay datos.</p>";
  }

  const sorted = [...items].sort((a, b) => b[1] - a[1]);

  const maxValue = Math.max(
    ...sorted.map(([_, value]) => value),
    1
  );

  return `
    <div class="country-chart">

      ${sorted.map(([name, value]) => {

        const width = (value / maxValue) * 100;

        const percentage = total
          ? ((value / total) * 100).toFixed(1)
          : "0.0";

        return `
          <div class="country-row">

            <div class="country-header">

              <span class="country-name">
  ${getCountryName(name)}
</span>

              <span class="country-value">
                ${value} (${percentage}%)
              </span>

            </div>

            <div class="country-bar-background">

              <div
                class="country-bar"
                style="width:${width}%"
              ></div>

            </div>

          </div>
        `;

      }).join("")}

    </div>
  `;
}
    function renderSourceList(items, total) {

  if (!items.length) {
    return "<p>No hay datos.</p>";
  }

  return items
    .sort((a, b) => b[1] - a[1])

      const percentage = total

      return `

}
function renderSourcesByLink(links) {

  if (!links.length) {
    return "<p>No hay datos.</p>";
  }

  return links.map(link => {

    const sources = Object.entries(link.sources || {})
      .sort((a, b) => b[1] - a[1]);

    const sourceItems = sources.length
      ? sources.map(([source, value]) => {

          const percentage = link.clicks
            ? ((value / link.clicks) * 100).toFixed(1)
            : "0.0";

          return `
            <div style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              padding:8px 0;
              border-bottom:1px solid #f1f3f7;
            ">

              <span>
                ${getSourceName(source)}
              </span>

              <span>
                <strong>${value}</strong>

                <small style="
                  color:#697386;
                  font-weight:normal;
                  margin-left:5px;
                ">
                  (${percentage}%)
                </small>

              </span>

            </div>
          `;

        }).join("")
      : "<span style='color:#697386;'>Sin fuentes registradas</span>";

    return `

        border-bottom:1px solid #edf0f5;

        ">

          <strong>
            ${link.name || link.slug || "Enlace desconocido"}

          <span class="badge">
            ${link.clicks} clics
          </span>

        </div>

        <div>
          ${sourceItems}
        </div>

      </div>
    `;

  }).join("");

}
async function copySourceLink(slug, source, button) {

  const url =
    `${window.location.origin}/${slug}?source=${encodeURIComponent(source)}`;

  try {

    await navigator.clipboard.writeText(url);

    const originalText = button.textContent;

    button.textContent = "✓ Copiado";
    button.disabled = true;

    setTimeout(() => {

      button.textContent = originalText;
      button.disabled = false;

    }, 1500);

  } catch (error) {

    console.error("No se pudo copiar el enlace:", error);

    alert("No se pudo copiar el enlace.");

  }

}

   function openCreateLink() {

  const name = prompt("Nombre del enlace:");

  if (!name) {
    return;
  }

  const destination_url = prompt("URL de destino:");

  if (!destination_url) {
    return;
  }

  const slug = name
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

  createLink(name, slug, destination_url);
}


async function createLink(name, slug, destination_url) {

  try {

    const response = await fetch("/api/create-link", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        slug,
        destination_url
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        "No se pudo crear el enlace"
      );
    }

    alert("✓ Enlace creado correctamente");

    loadStats();

  } catch (error) {

    console.error("Error creando enlace:", error);

    alert(
      "No se pudo crear el enlace:\n" +
      error.message
    );

  }

}
