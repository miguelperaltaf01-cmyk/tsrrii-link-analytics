<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Sobre RRII — Analytics</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 32px 20px;
    }

    header {
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
      color: #697386;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .card .label {
      color: #697386;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card .number {
      font-size: 32px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .panel h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .item:last-child {
      border-bottom: none;
    }

    .count {
      font-weight: bold;
    }

    .links {
      width: 100%;
      border-collapse: collapse;
    }

    .links th,
    .links td {
      text-align: left;
      padding: 14px 10px;
      border-bottom: 1px solid #edf0f5;
    }

    .links th {
      color: #697386;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #697386;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 18px;
      border-radius: 10px;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 20px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Todo Sobre RRII — Analytics</h1>
      <p>Panel de estadísticas de enlaces</p>
    </header>

    <div id="content">
      <div class="loading">
        Cargando estadísticas...
      </div>
    </div>

  </div>

  <script>
    async function loadStats() {
      const content = document.getElementById("content");

      try {
        const response = await fetch("/api/stats");

        if (!response.ok) {
          throw new Error("No se pudieron obtener las estadísticas");
        }

        const stats = await response.json();

        const sources = Object.entries(stats.by_source || {});
        const countries = Object.entries(stats.by_country || {});
        const devices = Object.entries(stats.by_device || {});
        const links = stats.by_link || [];

        content.innerHTML = `
          <div class="cards">

            <div class="card">
              <div class="label">Clics totales</div>
              <div class="number">${stats.total_clicks}</div>
            </div>

            <div class="card">
              <div class="label">WhatsApp</div>
              <div class="number">${stats.by_source?.whatsapp || 0}</div>
            </div>

            <div class="card">
              <div class="label">Web</div>
              <div class="number">${stats.by_source?.web || 0}</div>
            </div>

            <div class="card">
              <div class="label">Directos</div>
              <div class="number">${stats.by_source?.direct || 0}</div>
            </div>

          </div>

          <div class="grid">

            <div class="panel">
              <h2>Fuentes</h2>
              ${renderList(sources)}
            </div>

            <div class="panel">
              <h2>Países</h2>
              ${renderList(countries)}
            </div>

            <div class="panel">
              <h2>Dispositivos</h2>
              ${renderList(devices)}
            </div>

            <div class="panel">
              <h2>Clics por día</h2>
              ${renderList(Object.entries(stats.by_day || {}))}
            </div>

          </div>

          <div class="panel">

            <h2>Enlaces</h2>

            <table class="links">

              <thead>
                <tr>
                  <th>Enlace</th>
                  <th>Slug</th>
                  <th>Clics</th>
                </tr>
              </thead>

              <tbody>

                ${links.map(link => `
                  <tr>
                    <td>${link.name}</td>
                    <td>${link.slug || "-"}</td>
                    <td><strong>${link.clicks}</strong></td>
                  </tr>
                `).join("")}

              </tbody>

            </table>

          </div>
        `;

      } catch (error) {

        content.innerHTML = `
          <div class="error">
            Error cargando estadísticas: ${error.message}
          </div>
        `;
      }
    }

    function renderList(items) {

      if (!items.length) {
        return "<p>No hay datos.</p>";
      }

      return items.map(([name, value]) => `
        <div class="item">
          <span>${name}</span>
          <span class="count">${value}</span>
        </div>
      `).join("");
    }

    loadStats();
  </script>

</body>
</html>
